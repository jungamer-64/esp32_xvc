[package]
name = "esp32-xvc"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "esp32-xvc-server"
path = "src/main.rs"
test = false
bench = false

[features]
tdo-diagnostic = []
xvc-log = []

[dependencies]
embassy-executor = "0.10.0"
embassy-futures = "0.1.2"
embassy-net = { version = "0.9.1", default-features = false, features = ["medium-ethernet", "proto-ipv4", "tcp"] }
embassy-sync = "0.8.0"
embassy-time = "0.5.1"
esp-alloc = { version = "0.10.0", features = ["esp32"] }
esp-bootloader-esp-idf = { version = "0.5.0", features = ["esp32"] }
esp-hal = { version = "~1.1", features = ["esp32", "unstable"] }
esp-println = { version = "0.17.0", default-features = false, features = ["critical-section", "esp32", "uart"] }
esp-radio = { version = "0.18.0", features = ["esp32", "wifi"] }
esp-rtos = { version = "0.3.0", features = ["embassy", "esp32", "esp-alloc", "esp-radio"] }
static_cell = "2.1.1"

[profile.dev]
opt-level = "s"

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
